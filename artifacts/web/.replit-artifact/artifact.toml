kind = "web"
previewPath = "/"
title = "Wasatch Pediatrics Website"
version = "1.0.0"
id = "wasatch-peds-web"

[[services]]
localPort = 5000
name = "Website"
paths = ["/"]

[services.env]
PORT = "5000"

[services.development]
run = "pnpm --filter @workspace/web run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/web", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/web", "run", "preview"]

[services.production.run.env]
PORT = "5000"
NODE_ENV = "production"
